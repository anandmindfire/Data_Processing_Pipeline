# golangci-lint v2 configuration. CI fails on any finding.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose     # HTTP response bodies must be closed
    - copyloopvar   # loop variable copies that are no longer needed
    - errcheck      # unchecked errors
    - errorlint     # errors compared/asserted without errors.Is/As
    - gocyclo       # cyclomatic complexity
    - gosec         # security problems (paths, permissions, crypto, SSRF, ...)
    - govet         # compiler-level diagnostics
    - ineffassign   # ineffectual assignments
    - misspell      # spelling in comments and strings
    - noctx         # HTTP requests / SQL calls without a context
    - revive        # style and exported-API documentation
    - rowserrcheck  # sql.Rows.Err checked
    - sqlclosecheck # sql.Rows / Stmt closed
    - staticcheck   # advanced static analysis
    - unconvert     # unnecessary conversions
    - unused        # unused code
  settings:
    errcheck:
      check-type-assertions: true
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104 # duplicate of errcheck
    revive:
      rules:
        - name: exported
        - name: blank-imports
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, gocyclo, gosec, noctx]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/anandmindfire/data-processing-pipeline
