# .golangci.yml
# Comprehensive static analysis and linting configuration for Go.

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - govet         # Compiler-level diagnostics
    - errcheck      # Verify error return values are handled
    - staticcheck   # Advanced static analysis & bug detection
    - unused        # Checks for unused constants, variables, functions, and types
    - gosimple      # Code simplification suggestions
    - ineffassign   # Detects ineffectual assignments
    - revive        # Fast, drop-in configurable linter for Go
    - gocyclo       # Computes and checks function cyclomatic complexity
    - misspell      # Finds commonly misspelled English words in comments and strings
    - unconvert     # Removes unnecessary type conversions
    - bodyclose     # Checks whether HTTP response bodies are successfully closed

linters-settings:
  gocyclo:
    min-complexity: 15
  errcheck:
    check-type-assertions: true
    check-blank: false
  revive:
    rules:
      - name: exported
        disabled: false
      - name: package-comments
        disabled: true
      - name: blank-imports
        disabled: false

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-dirs:
    - vendor

