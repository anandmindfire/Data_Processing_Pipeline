# .lefthook.yml
# Fast, multi-threaded git hook manager for Go (Husky equivalent).
# Install via: brew install lefthook  (or go install github.com/evilmartians/lefthook@latest)
# Activate via: lefthook install

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.go"
      run: go fmt ./...
    vet:
      run: go vet ./...
    test:
      run: go test -short -race ./...

commit-msg:
  commands:
    conventional-commits:
      run: |
        MSG=$(head -n 1 {1})
        if echo "$MSG" | grep -qE '^Merge (branch|pull request|remote-tracking branch)'; then
          exit 0
        fi
        if echo "$MSG" | grep -qE '^Revert "'; then
          exit 0
        fi
        REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?!?: .+$"
        if ! echo "$MSG" | grep -qE "$REGEX"; then
          echo "❌ [commit-msg] Invalid commit message format."
          echo "Expected: <type>(<scope>): <subject>"
          echo "Example:  feat(pipeline): add streaming json reader"
          exit 1
        fi

