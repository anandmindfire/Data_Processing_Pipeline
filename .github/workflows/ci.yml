name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - Dev
      - production_readiness_check
  pull_request:
    branches:
      - main
      - master
      - Dev

permissions:
  contents: read

jobs:
  lint:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
          cache: true

      - name: Verify Code Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l -s .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted properly:"
            echo "$UNFORMATTED"
            echo "Run 'make fmt' or 'gofmt -s -w .' to fix."
            exit 1
          fi

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60
          args: --timeout=5m
        continue-on-error: true

  test:
    name: Unit & Race Condition Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
          cache: true

      - name: Run Tests with Race Detector
        run: |
          go test -race -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  build:
    name: Binary & Container Build Verification
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
          cache: true

      - name: Compile Pipeline Server Binary
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o bin/pipeline-server ./cmd/server

      - name: Verify Binary Execution
        run: |
          ./bin/pipeline-server --version
          ./bin/pipeline-server --help

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: data-processing-pipeline:latest

