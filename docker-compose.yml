services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: data-processing-pipeline:latest
    container_name: data-pipeline-server
    ports:
      # The container always listens on 8080; PORT only changes the host-side port.
      - "${PORT:-8080}:8080"
    environment:
      ADDR: ":8080"
      API_BASE_URL: "${API_BASE_URL:-http://localhost:${PORT:-8080}}" # public URL used in the OpenAPI spec
      API_BASE_PATH: "${API_BASE_PATH:-/api/v1}"
      API_KEY: "${API_KEY:-}"
      DATA_DIR: "/data"
      EXPORT_DIR: "/app/exports"
      INPUT_DIRS: "/app/samples,/app/inputs"
      MAX_ACTIVE_JOBS: "${MAX_ACTIVE_JOBS:-20}"
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-100}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-200}"
      SHUTDOWN_TIMEOUT: "25s"
      LOG_FORMAT: "json"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      # Named volumes are seeded from the image, so they are writable by the nonroot user.
      - pipeline-data:/data
      - pipeline-exports:/app/exports
      - ./samples:/app/samples:ro
      - ./inputs:/app/inputs:ro
    healthcheck:
      test: ["CMD", "/pipeline-server", "--healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    # Must exceed SHUTDOWN_TIMEOUT so running jobs can be cancelled and persisted.
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    restart: unless-stopped

volumes:
  pipeline-data:
  pipeline-exports:
