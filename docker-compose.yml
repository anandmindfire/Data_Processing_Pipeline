services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-pipeline-server
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ADDR: ":8080"
      DATA_DIR: "/data"
      EXPORT_DIR: "/app/exports"
      MAX_ACTIVE_JOBS: "20"
      RATE_LIMIT_RPS: "100"
      RATE_LIMIT_BURST: "200"
    volumes:
      - pipeline-data:/data
      - ./exports:/app/exports
      - ./samples:/app/samples:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Optional production PostgreSQL backend service
  postgres:
    image: postgres:16-alpine
    container_name: data-pipeline-postgres
    profiles:
      - with-db
    environment:
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: pipeline_password
      POSTGRES_DB: pipeline_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_user -d pipeline_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pipeline-data:
  postgres-data:
